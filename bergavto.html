<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DİM Admin — İdarəetmə Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <span class="text-xs font-bold uppercase tracking-widest text-blue-400">DİM SİSTEMİ</span>
                <h2 class="text-2xl font-bold text-white mt-1">Admin Girişi</h2>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">İşçi Kodu (KOD)</label>
                    <input type="text" id="adminCode" required placeholder="İşçi kodunu daxil edin" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Parol (AA)</label>
                    <input type="password" id="adminPass" required placeholder="Parolu daxil edin" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:border-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-xl transition text-sm">
                    Sistemə Daxil Ol
                </button>
                <p id="loginError" class="text-red-400 text-xs text-center hidden">KOD və ya Parol yanlışdır!</p>
            </form>
        </div>
    </div>

    <!-- Admin Main Dashboard -->
    <div id="adminDashboard" class="hidden">
        <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="bg-blue-600 text-white font-bold px-3 py-1 rounded text-sm">DİM</span>
                <h1 class="font-bold text-lg hidden sm:block">Qəbul Bazası İdarəetmə Paneli</h1>
            </div>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded transition">
                <i class="fa-solid fa-globe mr-1"></i> Sayta Keçid
            </a>
        </nav>

        <div class="max-w-6xl mx-auto p-6 space-y-8">
            <!-- Form -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-blue-400 flex items-center">
                    <i class="fa-solid fa-user-plus mr-2"></i> Şagird və İxtisas Məlumatı Daxil Et
                </h2>
                <form id="addStudentForm" onsubmit="saveStudent(event)" class="space-y-4">
                    <!-- Şagird Məlumatları -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">İş Nömrəsi</label>
                            <input type="text" id="adminWorkNum" required placeholder="123456" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Şagirdin Adı Soyadı</label>
                            <input type="text" id="adminName" required placeholder="Məs: Əliyev Əli" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Şagirdin Topladığı Bal</label>
                            <input type="number" step="0.1" id="adminScore" required placeholder="542.5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <!-- İxtisas və Qəbul Məlumatları -->
                    <div class="border-t border-slate-700 pt-4 mt-2">
                        <label class="block text-xs font-semibold text-blue-400 mb-2">Qəbul Olunduğu İxtisas Detalları (İsteğe bağlı):</label>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Universitet</label>
                                <input type="text" id="adminUni" placeholder="BDU" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">İxtisas Adı</label>
                                <input type="text" id="adminMajor" placeholder="Kompüter Elmləri" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Ödəniş Tipi</label>
                                <select id="adminFeeType" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none text-slate-300">
                                    <option value="Ödənişsiz">Ödənişsiz (Dövlət Sifarişi)</option>
                                    <option value="Ödənişli">Ödənişli</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">İxtisasın Keçid Balı</label>
                                <input type="number" step="0.1" id="adminMinScore" placeholder="535.0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition">
                        Baza Yaddaşında Saxla
                    </button>
                </form>
            </div>

            <!-- Table -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-slate-200">Bazada Olan Şagird Siyahısı</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
                            <tr>
                                <th class="p-3">İş Nömrəsi</th>
                                <th class="p-3">Ad Soyad</th>
                                <th class="p-3">Şagird Balı</th>
                                <th class="p-3">Qəbul Olduğu Yer / Ödəniş</th>
                                <th class="p-3">İxtisas Keçid Balı</th>
                                <th class="p-3 text-right">Sil</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody" class="divide-y divide-slate-700">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const code = document.getElementById('adminCode').value.trim();
            const pass = document.getElementById('adminPass').value.trim();

            if(code === "K9ESPORTS_211" && pass === "AA211_90") {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                loadAdminTable();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function loadAdminTable() {
            const data = JSON.parse(localStorage.getItem('dim_data')) || {};
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';

            Object.keys(data).forEach(workNum => {
                const s = data[workNum];
                const accepted = (s.acceptedIndex >= 0 && s.choices[s.acceptedIndex]) ? s.choices[s.acceptedIndex] : null;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-mono font-bold text-blue-400">${workNum}</td>
                    <td class="p-3 font-semibold text-white">${s.name}</td>
                    <td class="p-3 font-bold">${s.score}</td>
                    <td class="p-3">
                        ${accepted 
                            ? `${accepted.uni} - ${accepted.major} <span class="text-xs px-2 py-0.5 rounded ${accepted.feeType === 'Ödənişsiz' ? 'bg-blue-900/60 text-blue-300' : 'bg-orange-900/60 text-orange-300'}">${accepted.feeType}</span>` 
                            : '<span class="text-red-400">Qəbul olmayıb</span>'}
                    </td>
                    <td class="p-3">${accepted ? accepted.minScore : '---'}</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteStudent('${workNum}')" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 p-2 rounded transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function saveStudent(e) {
            e.preventDefault();
            const workNum = document.getElementById('adminWorkNum').value.trim();
            const name = document.getElementById('adminName').value.trim();
            const score = parseFloat(document.getElementById('adminScore').value);
            
            const uni = document.getElementById('adminUni').value.trim();
            const major = document.getElementById('adminMajor').value.trim();
            const feeType = document.getElementById('adminFeeType').value;
            const minScore = parseFloat(document.getElementById('adminMinScore').value) || score;

            const data = JSON.parse(localStorage.getItem('dim_data')) || {};

            let choices = [];
            let acceptedIndex = -1;

            if(uni && major) {
                choices.push({ 
                    uni: uni, 
                    major: major, 
                    feeType: feeType, 
                    minScore: minScore 
                });
                acceptedIndex = 0;
            }

            data[workNum] = {
                name: name,
                score: score,
                acceptedIndex: acceptedIndex,
                choices: choices
            };

            localStorage.setItem('dim_data', JSON.stringify(data));
            document.getElementById('addStudentForm').reset();
            loadAdminTable();
        }

        function deleteStudent(workNum) {
            if(confirm(`${workNum} nömrəli şagird məlumatını silmək istədiyinizdən əminsiniz?`)) {
                const data = JSON.parse(localStorage.getItem('dim_data')) || {};
                delete data[workNum];
                localStorage.setItem('dim_data', JSON.stringify(data));
                loadAdminTable();
            }
        }
    </script>
</body>
</html>
